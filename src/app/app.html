<app-header [title]="title" />

<main class="app">
  <div class="app__container">
    <nav class="tabs">
      <a
        class="tabs__tab"
        routerLink="/ferias"
        routerLinkActive="tabs__tab--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Ferias
      </a>
      <a
        class="tabs__tab"
        routerLink="/ferias/favoritas"
        routerLinkActive="tabs__tab--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Favoritas
      </a>
    </nav>

    <router-outlet />
  </div>
</main>
